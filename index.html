<head>

</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Neorgon">
      </a>
      <a href="./" class="header-title-link">
        <h1>Character Sheet</h1>
        <div class="header-subtitle">About you — and how to present to you.</div>
      </a>
    </div>
    <button type="button" class="auth-toggle" id="authToggle" aria-label="Account">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="10" r="3"/>
        <path d="M6 19c1.2-3 3.5-4 6-4s4.8 1 6 4"/>
      </svg>
    </button>
    <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
  </header>

  <div class="auth-modal" id="authModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="auth-modal-backdrop" id="authModalBackdrop" tabindex="-1" aria-hidden="true"></div>
    <div class="auth-modal-dialog">
      <div class="auth-modal-header">
        <h2 class="auth-modal-title" id="authModalTitle">Sign in</h2>
        <button type="button" class="auth-modal-close" id="authModalClose" aria-label="Close dialog">&times;</button>
      </div>
      <div class="auth-modal-body">
        <div id="authGate">
          <div id="neorgon-signin-mount" class="neorgon-clerk-mount"></div>
        </div>
        <div class="auth-user-info" id="authUserInfo" hidden>
          <span class="auth-username" id="authDisplayUser"></span>
          <div id="neorgon-user-mount" class="neorgon-clerk-mount"></div>
          <div class="legacy-link-card" id="legacyLinkSection" hidden>
            <p class="legacy-link-hint">Had a password-only Neorgon account? Link it once — your password is checked and not stored in the mapping.</p>
            <div class="legacy-link-fields">
              <label class="sr-only" for="legacyLinkUser">Legacy username</label>
              <input type="text" id="legacyLinkUser" class="legacy-link-input" autocomplete="username" placeholder="Legacy username">
              <label class="sr-only" for="legacyLinkPassword">Legacy password</label>
              <input type="password" id="legacyLinkPassword" class="legacy-link-input" autocomplete="current-password" placeholder="Legacy password">
            </div>
            <button type="button" class="btn btn-sm btn-primary legacy-link-btn" id="legacyLinkBtn">Link legacy account</button>
            <div id="legacyLinkMessage" class="legacy-link-message" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main id="main">
    <div class="section-wrapper">
      <button class="section-arrow arrow-left" id="arrowLeft" onclick="prevSection()" aria-label="Previous section">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    <div class="container">

      <!-- Sheets bar (visible when logged in) -->
      <div class="sheets-bar" id="sheetsBar" hidden>
        <select class="sheet-select" id="sheetSelect" onchange="loadSheet(this.value)">
          <option value="">— select a sheet —</option>
        </select>
        <button class="btn btn-sm" onclick="createNewSheet()">+ New</button>
        <button class="btn btn-sm btn-primary" onclick="saveCurrentSheet()">Save</button>
        <button class="btn btn-sm btn-danger" onclick="deleteCurrentSheet()">Delete</button>
      </div>

      <!-- Progress bar -->
      <div class="xp-bar-wrapper">
        <div class="xp-bar-label">
          <span id="section-label">Identity</span>
          <span id="xp-text">1 / 7</span>
        </div>
        <div class="xp-bar-track">
          <div class="xp-bar-fill" id="xp-fill" style="width:0%"></div>
        </div>
        <div class="section-dots" id="section-dots"></div>
      </div>

      <!-- Section container -->
      <div id="section-container"></div>

      <!-- Navigation -->
      <div class="nav-buttons" id="nav-buttons">
        <button class="btn btn-secondary" id="btn-prev" onclick="prevSection()">Back</button>
        <div class="nav-center">
          <button class="btn btn-random" id="btn-random" onclick="randomFill()" title="Roll the dice — try random answers">Randomize</button>
          <button class="btn btn-restart" id="btn-restart" onclick="startOver()" title="Clear and start over">Start Over</button>
        </div>
        <button class="btn btn-primary" id="btn-next" onclick="nextSection()">Next</button>
      </div>

    </div>
      <button class="section-arrow arrow-right" id="arrowRight" onclick="nextSection()" aria-label="Next section">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Media shelf -->
    <div class="media-shelf" id="media-shelf" style="display:none"></div>

  </main>

  <!-- Character Card Modal -->
  <div class="modal-overlay" id="card-modal">
    <div class="modal-content card-modal-content">
      <button class="modal-close" onclick="closeCardModal()" aria-label="Close card preview">&times;</button>
      <div class="card-modal-panels">
        <div class="modal-panel modal-panel--intro">
          <div class="panel-label">Intro Slide</div>
          <iframe id="intro-preview-frame" class="intro-preview-iframe" title="Intro slide preview" sandbox="allow-scripts"></iframe>
        </div>
        <div class="modal-panel modal-panel--card">
          <div class="panel-label">Character Card</div>
          <canvas id="card-canvas" width="800" height="1100"></canvas>
          <div class="card-modal-actions">
            <button class="btn btn-primary btn-icon" onclick="downloadCard()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download PNG
            </button>
            <button class="btn btn-primary btn-icon" onclick="downloadHighResCard()" style="background: linear-gradient(135deg, #34d399, #10b981)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              Download High-Res
            </button>
            <button class="btn btn-primary btn-icon" onclick="downloadPDF()" style="background: linear-gradient(135deg, #fb923c, #fbbf24)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              Download PDF
            </button>
          </div>
          <div class="card-modal-actions" style="margin-top: 8px;">
            <button class="btn btn-secondary btn-icon" onclick="shareCard('image')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Share Card
            </button>
            <button class="btn btn-secondary btn-icon" onclick="generateQRCode()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/><line x1="21" y1="14" x2="21" y2="17"/><line x1="21" y1="20" x2="21" y2="21"/><line x1="14" y1="21" x2="17" y2="21"/></svg>
              QR Code
            </button>
            <button class="btn btn-secondary btn-icon" onclick="copyScript()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              Copy Presenter Script
            </button>
            <button class="btn btn-secondary" onclick="closeCardModal()">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
